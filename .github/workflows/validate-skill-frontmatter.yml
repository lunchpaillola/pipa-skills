name: Validate Skills

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "skills/**/*.md"
      - "skills/**/evals/**/*.json"
      - "evals/**/*.json"
      - "README.md"
      - "docs/**/*.md"
      - "scripts/validate_skill_frontmatter.rb"
      - "scripts/validate_skill_evals.rb"
      - "scripts/validate_skill_evals_test.rb"
      - "scripts/validate_skill_architecture.rb"
      - "scripts/validate_skill_architecture_test.rb"
      - ".github/workflows/validate-skill-frontmatter.yml"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "skills/**/*.md"
      - "skills/**/evals/**/*.json"
      - "evals/**/*.json"
      - "README.md"
      - "docs/**/*.md"
      - "scripts/validate_skill_frontmatter.rb"
      - "scripts/validate_skill_evals.rb"
      - "scripts/validate_skill_evals_test.rb"
      - "scripts/validate_skill_architecture.rb"
      - "scripts/validate_skill_architecture_test.rb"
      - ".github/workflows/validate-skill-frontmatter.yml"

jobs:
  validate-skills:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Validate SKILL.md frontmatter
        run: ruby scripts/validate_skill_frontmatter.rb

      - name: Validate skill eval fixtures
        run: ruby scripts/validate_skill_evals_test.rb

      - name: Validate skill architecture
        run: ruby scripts/validate_skill_architecture_test.rb

      - name: Run relay protocol tests
        run: npm run test:relay
